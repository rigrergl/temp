<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Galaga: Space Defender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background: #000;
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', monospace;
        }

        canvas {
            display: block;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.85);
            z-index: 10;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        #startScreen h1 {
            font-size: 10vw;
            max-font-size: 64px;
            color: #ff0;
            text-shadow: 0 0 20px #f80, 0 0 40px #f00;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        #startScreen p, #gameOverScreen p {
            font-size: 4vw;
            max-font-size: 20px;
            color: #0ff;
            margin-bottom: 10px;
        }

        .btn {
            margin-top: 30px;
            padding: 16px 48px;
            font-size: 6vw;
            font-family: 'Courier New', monospace;
            background: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 8px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .btn:active {
            background: #0f03;
        }

        #gameOverScreen h2 {
            font-size: 9vw;
            color: #f00;
            text-shadow: 0 0 20px #f00;
            margin-bottom: 10px;
        }

        #gameOverScreen .score-display {
            font-size: 7vw;
            color: #ff0;
            margin: 10px 0;
        }

        #hud {
            position: absolute;
            top: env(safe-area-inset-top, 8px);
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 3.5vw;
            z-index: 5;
            pointer-events: none;
            padding-top: 8px;
        }

        #hud span {
            text-shadow: 0 0 6px rgba(255,255,255,0.5);
        }

        #lives {
            color: #0f0;
        }
    </style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
    <span id="scoreHud">SCORE: 0</span>
    <span id="stageHud">STAGE 1</span>
    <span id="lives">♥♥♥</span>
</div>

<div id="startScreen">
    <h1>GALAGA</h1>
    <p>Drag to move your ship</p>
    <p>Tap to fire</p>
    <p>Destroy all alien waves!</p>
    <button class="btn" id="startBtn">START</button>
</div>

<div id="gameOverScreen" style="display:none">
    <h2>GAME OVER</h2>
    <div class="score-display" id="finalScore">0</div>
    <p id="hiScoreText"></p>
    <button class="btn" id="restartBtn">PLAY AGAIN</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

let W, H, scale;
let gameRunning = false;
let score = 0;
let lives = 3;
let stage = 1;
let hiScore = parseInt(localStorage.getItem('galagaHi') || '0');
let frameCount = 0;

// Player
let player = { x: 0, y: 0, w: 30, h: 30, speed: 6 };
let bullets = [];
let enemies = [];
let enemyBullets = [];
let particles = [];
let stars = [];
let touchX = null;
let lastFireTime = 0;
const FIRE_RATE = 220; // ms between shots

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    scale = Math.min(W / 400, H / 700);
    player.w = 28 * scale;
    player.h = 28 * scale;
    player.y = H - 80 * scale;
    if (!gameRunning) player.x = W / 2;

    // Generate stars
    stars = [];
    for (let i = 0; i < 100; i++) {
        stars.push({
            x: Math.random() * W,
            y: Math.random() * H,
            s: Math.random() * 2 + 0.5,
            speed: Math.random() * 0.5 + 0.2
        });
    }
}

window.addEventListener('resize', resize);
resize();

// Draw the player ship (classic Galaga style)
function drawShip(x, y, w, h) {
    ctx.save();
    ctx.translate(x, y);

    // Main body
    ctx.fillStyle = '#4cf';
    ctx.beginPath();
    ctx.moveTo(0, -h/2);
    ctx.lineTo(-w/2, h/2);
    ctx.lineTo(-w/4, h/3);
    ctx.lineTo(w/4, h/3);
    ctx.lineTo(w/2, h/2);
    ctx.closePath();
    ctx.fill();

    // Cockpit
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(0, -h/6, w/6, 0, Math.PI * 2);
    ctx.fill();

    // Wings
    ctx.fillStyle = '#08f';
    ctx.beginPath();
    ctx.moveTo(-w/2, h/2);
    ctx.lineTo(-w/2 - w/5, h/2 + h/6);
    ctx.lineTo(-w/4, h/3);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(w/2, h/2);
    ctx.lineTo(w/2 + w/5, h/2 + h/6);
    ctx.lineTo(w/4, h/3);
    ctx.closePath();
    ctx.fill();

    // Thruster glow
    ctx.fillStyle = `hsl(${30 + Math.random()*20}, 100%, ${50 + Math.random()*30}%)`;
    ctx.beginPath();
    ctx.moveTo(-w/6, h/3);
    ctx.lineTo(0, h/2 + h/4 + Math.random() * h/6);
    ctx.lineTo(w/6, h/3);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
}

// Enemy types
const ENEMY_TYPES = [
    { // Bug - basic
        color: '#f44', color2: '#f88',
        draw(x, y, w, h, t) {
            ctx.save(); ctx.translate(x, y);
            ctx.fillStyle = this.color;
            // Body
            ctx.beginPath();
            ctx.ellipse(0, 0, w/2, h/2, 0, 0, Math.PI*2);
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-w/5, -h/6, w/7, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/5, -h/6, w/7, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(-w/5, -h/6, w/12, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/5, -h/6, w/12, 0, Math.PI*2); ctx.fill();
            // Wings
            ctx.fillStyle = this.color2;
            let flap = Math.sin(t * 0.1) * 0.3;
            ctx.beginPath();
            ctx.ellipse(-w/2 - w/5, 0, w/4, h/3, flap, 0, Math.PI*2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(w/2 + w/5, 0, w/4, h/3, -flap, 0, Math.PI*2);
            ctx.fill();
            ctx.restore();
        },
        hp: 1, score: 100
    },
    { // Bee - swooper
        color: '#ff0', color2: '#fa0',
        draw(x, y, w, h, t) {
            ctx.save(); ctx.translate(x, y);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.moveTo(0, -h/2);
            ctx.lineTo(w/2, 0);
            ctx.lineTo(w/3, h/2);
            ctx.lineTo(-w/3, h/2);
            ctx.lineTo(-w/2, 0);
            ctx.closePath();
            ctx.fill();
            // Stripes
            ctx.fillStyle = '#000';
            ctx.fillRect(-w/3, -h/8, w*2/3, h/6);
            ctx.fillRect(-w/3, h/6, w*2/3, h/6);
            // Eyes
            ctx.fillStyle = '#f00';
            ctx.beginPath(); ctx.arc(-w/5, -h/5, w/8, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/5, -h/5, w/8, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        },
        hp: 1, score: 150
    },
    { // Boss - takes 2 hits
        color: '#0f0', color2: '#0a0',
        draw(x, y, w, h, t) {
            ctx.save(); ctx.translate(x, y);
            w *= 1.3; h *= 1.3;
            ctx.fillStyle = this.color;
            // Big body
            ctx.beginPath();
            ctx.arc(0, 0, w/2, 0, Math.PI * 2);
            ctx.fill();
            // Horns
            ctx.fillStyle = this.color2;
            ctx.beginPath();
            ctx.moveTo(-w/3, -h/3);
            ctx.lineTo(-w/2 - w/5, -h/2 - h/3);
            ctx.lineTo(-w/6, -h/3);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(w/3, -h/3);
            ctx.lineTo(w/2 + w/5, -h/2 - h/3);
            ctx.lineTo(w/6, -h/3);
            ctx.closePath();
            ctx.fill();
            // Eyes
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(-w/5, -h/10, w/6, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/5, -h/10, w/6, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle = '#f0f';
            ctx.beginPath(); ctx.arc(-w/5, -h/10, w/10, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w/5, -h/10, w/10, 0, Math.PI*2); ctx.fill();
            ctx.restore();
        },
        hp: 3, score: 400
    }
];

function spawnWave() {
    enemies = [];
    const rows = Math.min(3 + Math.floor(stage / 2), 5);
    const cols = Math.min(5 + Math.floor(stage / 3), 8);
    const ew = 24 * scale;
    const eh = 22 * scale;
    const gapX = ew * 1.8;
    const gapY = eh * 1.6;
    const startX = W/2 - (cols - 1) * gapX / 2;
    const startY = 60 * scale;

    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            let type;
            if (r === 0) type = 2; // bosses in top row
            else if (r === 1) type = 1; // bees
            else type = 0; // bugs

            const et = ENEMY_TYPES[type];
            enemies.push({
                x: startX + c * gapX,
                y: startY + r * gapY,
                w: ew, h: eh,
                type: type,
                hp: et.hp,
                homeX: startX + c * gapX,
                homeY: startY + r * gapY,
                state: 'formation', // formation, diving, returning
                diveTimer: 200 + Math.random() * 600,
                diveAngle: 0,
                diveProgress: 0,
                alive: true
            });
        }
    }
}

function spawnParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 30 + Math.random() * 20,
            maxLife: 50,
            color,
            size: 2 + Math.random() * 3
        });
    }
}

// Formation movement
let formationX = 0;
let formationDir = 1;
const formationSpeed = 0.6;

function update() {
    frameCount++;

    // Stars
    for (let s of stars) {
        s.y += s.speed * scale;
        if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
    }

    // Formation sway
    formationX += formationDir * formationSpeed * scale;
    if (Math.abs(formationX) > 40 * scale) formationDir *= -1;

    // Enemies
    let aliveCount = 0;
    for (let e of enemies) {
        if (!e.alive) continue;
        aliveCount++;

        if (e.state === 'formation') {
            e.x = e.homeX + formationX;
            e.y = e.homeY + Math.sin(frameCount * 0.02 + e.homeX * 0.01) * 4 * scale;

            e.diveTimer--;
            if (e.diveTimer <= 0 && Math.random() < 0.01 + stage * 0.003) {
                e.state = 'diving';
                e.diveProgress = 0;
                e.diveStartX = e.x;
                e.diveStartY = e.y;
                // Aim toward player
                e.diveAngle = Math.atan2(player.y - e.y, player.x - e.x);
            }

            // Shooting
            if (Math.random() < 0.001 + stage * 0.0005) {
                enemyBullets.push({
                    x: e.x,
                    y: e.y + e.h/2,
                    vy: 3 * scale + stage * 0.3,
                    vx: (Math.random() - 0.5) * scale
                });
            }
        } else if (e.state === 'diving') {
            e.diveProgress += 0.015 + stage * 0.002;
            // Curved dive path
            e.x = e.diveStartX + Math.sin(e.diveProgress * 3) * 80 * scale;
            e.y = e.diveStartY + e.diveProgress * 300 * scale;

            // Shoot while diving
            if (Math.random() < 0.03) {
                enemyBullets.push({
                    x: e.x, y: e.y + e.h/2,
                    vy: 4 * scale,
                    vx: (player.x - e.x) * 0.01
                });
            }

            if (e.y > H + 50) {
                e.state = 'returning';
                e.x = e.homeX + formationX;
                e.y = -30;
            }
        } else if (e.state === 'returning') {
            let targetY = e.homeY;
            let targetX = e.homeX + formationX;
            e.x += (targetX - e.x) * 0.05;
            e.y += (targetY - e.y) * 0.05;
            if (Math.abs(e.y - targetY) < 2) {
                e.state = 'formation';
                e.diveTimer = 200 + Math.random() * 400;
            }
        }
    }

    // Next stage
    if (aliveCount === 0 && gameRunning) {
        stage++;
        document.getElementById('stageHud').textContent = 'STAGE ' + stage;
        spawnWave();
    }

    // Player bullets
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= 8 * scale;
        if (b.y < -10) { bullets.splice(i, 1); continue; }

        // Hit detection
        for (let e of enemies) {
            if (!e.alive) continue;
            if (Math.abs(b.x - e.x) < e.w/2 + 4 && Math.abs(b.y - e.y) < e.h/2 + 4) {
                bullets.splice(i, 1);
                e.hp--;
                if (e.hp <= 0) {
                    e.alive = false;
                    score += ENEMY_TYPES[e.type].score;
                    document.getElementById('scoreHud').textContent = 'SCORE: ' + score;
                    spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, 12);
                } else {
                    spawnParticles(e.x, e.y, '#fff', 4);
                }
                break;
            }
        }
    }

    // Enemy bullets
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let b = enemyBullets[i];
        b.y += b.vy;
        b.x += (b.vx || 0);
        if (b.y > H + 10) { enemyBullets.splice(i, 1); continue; }

        // Hit player
        if (Math.abs(b.x - player.x) < player.w/2 && Math.abs(b.y - player.y) < player.h/2) {
            enemyBullets.splice(i, 1);
            playerHit();
        }
    }

    // Enemy collision with player
    for (let e of enemies) {
        if (!e.alive) continue;
        if (Math.abs(e.x - player.x) < (e.w + player.w)/2 && Math.abs(e.y - player.y) < (e.h + player.h)/2) {
            e.alive = false;
            spawnParticles(e.x, e.y, ENEMY_TYPES[e.type].color, 12);
            playerHit();
        }
    }

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }
}

function playerHit() {
    lives--;
    spawnParticles(player.x, player.y, '#4cf', 20);
    updateLivesHud();
    if (lives <= 0) {
        gameOver();
    } else {
        player.x = W / 2;
    }
}

function updateLivesHud() {
    document.getElementById('lives').textContent = '♥'.repeat(Math.max(0, lives));
}

function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    // Stars
    for (let s of stars) {
        let alpha = 0.3 + Math.sin(frameCount * 0.03 + s.x) * 0.3;
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;
        ctx.fillRect(s.x, s.y, s.s, s.s);
    }

    // Player
    if (gameRunning && lives > 0) {
        drawShip(player.x, player.y, player.w, player.h);
    }

    // Player bullets
    ctx.fillStyle = '#ff0';
    ctx.shadowColor = '#ff0';
    ctx.shadowBlur = 6;
    for (let b of bullets) {
        ctx.fillRect(b.x - 2, b.y - 6, 4, 12);
    }
    ctx.shadowBlur = 0;

    // Enemies
    for (let e of enemies) {
        if (!e.alive) continue;
        ENEMY_TYPES[e.type].draw(e.x, e.y, e.w, e.h, frameCount);
    }

    // Enemy bullets
    ctx.fillStyle = '#f44';
    ctx.shadowColor = '#f44';
    ctx.shadowBlur = 4;
    for (let b of enemyBullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 3 * scale, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;

    // Particles
    for (let p of particles) {
        let alpha = p.life / p.maxLife;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - p.size/2, p.y - p.size/2, p.size, p.size);
    }
    ctx.globalAlpha = 1;
}

function gameLoop() {
    if (!gameRunning) return;
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';
    score = 0;
    lives = 3;
    stage = 1;
    bullets = [];
    enemyBullets = [];
    particles = [];
    formationX = 0;
    frameCount = 0;
    player.x = W / 2;
    player.y = H - 80 * scale;
    document.getElementById('scoreHud').textContent = 'SCORE: 0';
    document.getElementById('stageHud').textContent = 'STAGE 1';
    updateLivesHud();
    spawnWave();
    gameRunning = true;
    gameLoop();
}

function gameOver() {
    gameRunning = false;
    if (score > hiScore) {
        hiScore = score;
        localStorage.setItem('galagaHi', hiScore);
    }
    document.getElementById('finalScore').textContent = 'SCORE: ' + score;
    document.getElementById('hiScoreText').textContent = 'HI-SCORE: ' + hiScore;
    document.getElementById('gameOverScreen').style.display = 'flex';
}

// Touch controls
let activeTouchId = null;
let isTapFire = false;

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (!gameRunning) return;
    const t = e.changedTouches[0];
    activeTouchId = t.identifier;
    touchX = t.clientX;
    isTapFire = true;
    // Fire on tap
    fire();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!gameRunning) return;
    for (let t of e.changedTouches) {
        if (t.identifier === activeTouchId) {
            let dx = t.clientX - touchX;
            if (Math.abs(dx) > 3) isTapFire = false;
            player.x += dx;
            player.x = Math.max(player.w/2, Math.min(W - player.w/2, player.x));
            touchX = t.clientX;
        }
    }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    for (let t of e.changedTouches) {
        if (t.identifier === activeTouchId) {
            activeTouchId = null;
        }
    }
}, { passive: false });

// Auto-fire while touching
setInterval(() => {
    if (gameRunning && activeTouchId !== null) {
        fire();
    }
}, FIRE_RATE);

function fire() {
    let now = Date.now();
    if (now - lastFireTime < FIRE_RATE) return;
    lastFireTime = now;
    bullets.push({ x: player.x, y: player.y - player.h/2 });
}

// Keyboard support too
let keys = {};
document.addEventListener('keydown', (e) => { keys[e.key] = true; if(e.key === ' ') fire(); });
document.addEventListener('keyup', (e) => keys[e.key] = false);

setInterval(() => {
    if (!gameRunning) return;
    if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(player.w/2, player.x - player.speed * scale);
    if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W - player.w/2, player.x + player.speed * scale);
}, 16);

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// Initial draw
draw();
</script>
</body>
</html>
