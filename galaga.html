<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Galaga: Space Defender</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background: #000;
            overflow: hidden;
            touch-action: none;
            position: fixed;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', monospace;
        }

        #gameContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(0,0,0,0.88);
            z-index: 10;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        #startScreen h1 {
            font-size: clamp(36px, 10vw, 64px);
            color: #ff0;
            text-shadow: 0 0 20px #f80, 0 0 40px #f00, 0 0 60px #f80;
            margin-bottom: 20px;
            letter-spacing: 6px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 0 0 20px #f80, 0 0 40px #f00, 0 0 60px #f80; }
            50% { text-shadow: 0 0 30px #ff0, 0 0 60px #f80, 0 0 90px #f00; }
        }

        #startScreen p, #gameOverScreen p {
            font-size: clamp(14px, 4vw, 20px);
            color: #0ff;
            margin-bottom: 10px;
        }

        .btn {
            margin-top: 30px;
            padding: 18px 54px;
            font-size: clamp(18px, 6vw, 32px);
            font-family: 'Courier New', monospace;
            background: transparent;
            color: #0f0;
            border: 2px solid #0f0;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 0 0 10px #0f0;
            box-shadow: 0 0 15px rgba(0,255,0,0.3), inset 0 0 15px rgba(0,255,0,0.1);
        }

        .btn:active {
            background: rgba(0,255,0,0.15);
        }

        #gameOverScreen h2 {
            font-size: clamp(28px, 9vw, 56px);
            color: #f00;
            text-shadow: 0 0 20px #f00;
            margin-bottom: 10px;
        }

        #gameOverScreen .score-display {
            font-size: clamp(22px, 7vw, 44px);
            color: #ff0;
            margin: 10px 0;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: clamp(12px, 3.5vw, 18px);
            z-index: 5;
            pointer-events: none;
            padding: calc(env(safe-area-inset-top, 8px) + 6px) 12px 0 12px;
        }

        #hud span {
            text-shadow: 0 0 6px rgba(255,255,255,0.5);
        }

        #lives {
            color: #f44;
            text-shadow: 0 0 8px rgba(255,50,50,0.7);
            transition: transform 0.15s ease-out, text-shadow 0.15s ease-out;
            display: inline-block;
        }
        #lives.hit {
            transform: scale(1.8);
            text-shadow: 0 0 16px rgba(255,0,0,1), 0 0 30px rgba(255,0,0,0.6);
        }

        #powerUpHud {
            position: absolute;
            top: calc(env(safe-area-inset-top, 8px) + 28px);
            left: 0;
            right: 0;
            text-align: center;
            color: #ff0;
            font-size: clamp(10px, 2.8vw, 14px);
            z-index: 5;
            pointer-events: none;
            text-shadow: 0 0 8px rgba(255,255,0,0.6);
            opacity: 0;
            transition: opacity 0.3s;
        }

        #touchZone {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 45%;
            z-index: 4;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <canvas id="c"></canvas>

    <div id="hud">
        <span id="scoreHud">SCORE: 0</span>
        <span id="stageHud">STAGE 1</span>
        <span id="lives">♥♥♥</span>
    </div>
    <div id="powerUpHud" aria-hidden="true"></div>

    <div id="touchZone"></div>

    <div id="startScreen">
        <h1>GALAGA</h1>
        <p>Drag left/right to move</p>
        <p>Ship auto-fires!</p>
        <p>Grab power-ups for special weapons!</p>
        <button class="btn" id="startBtn">START</button>
    </div>

    <div id="gameOverScreen" style="display:none">
        <h2>GAME OVER</h2>
        <div class="score-display" id="finalScore">0</div>
        <p id="hiScoreText"></p>
        <button class="btn" id="restartBtn">PLAY AGAIN</button>
    </div>
</div>

<script>
(function() {
    'use strict';

    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    const touchZone = document.getElementById('touchZone');
    const powerUpHud = document.getElementById('powerUpHud');

    let W, H, scale;
    let gameRunning = false;
    let score = 0;
    let lives = 3;
    let stage = 1;
    let hiScore = parseInt(localStorage.getItem('galagaHi') || '0');
    let frameCount = 0;
    let animId = null;

    function getViewportHeight() { return window.innerHeight; }

    // Player
    let player = { x: 0, y: 0, w: 30, h: 30, speed: 6 };
    let bullets = [];
    let enemies = [];
    let enemyBullets = [];
    let particles = [];
    let stars = [];
    let powerUps = [];
    let lasers = []; // active laser beams
    let missiles = []; // homing missiles
    let lastFireTime = 0;
    const FIRE_RATE = 120; // faster!
    let autoFireInterval = null;

    // Power-up state
    let currentPowerUp = null; // 'spread', 'laser', 'missile', 'shield'
    let powerUpTimer = 0;
    const POWERUP_DURATION = 300; // ~5 seconds at 60fps
    let shieldHP = 0;
    let screenShake = 0;
    let invincibleTimer = 0;
    let damageFlash = 0;
    let blackHoles = [];
    let boomerangs = [];
    let lightningBolts = [];
    let gravityFlipped = false;
    let minigunAngle = 0;
    let comboCount = 0;
    let comboTimer = 0;
    let floatingTexts = [];

    // Power-up definitions
    const POWERUP_TYPES = [
        { id: 'spread', label: 'SPREAD SHOT', color: '#f80', icon: 'W' },
        { id: 'laser',  label: 'MEGA LASER',  color: '#0ff', icon: 'L' },
        { id: 'missile', label: 'HOMING MISSILES', color: '#f0f', icon: 'M' },
        { id: 'shield', label: 'SHIELD',      color: '#0f0', icon: 'S' },
        { id: 'timewarp', label: 'TIME WARP', color: '#a0f', icon: 'T' },
        { id: 'pierce', label: 'PIERCING SHOT', color: '#ff4', icon: 'P' },
        { id: 'blackhole', label: 'BLACK HOLE', color: '#609', icon: 'O' },
        { id: 'boomerang', label: 'BOOMERANG', color: '#f55', icon: 'B' },
        { id: 'drunk', label: 'DRUNK MISSILES', color: '#5f5', icon: 'D' },
        { id: 'lightning', label: 'CHAIN LIGHTNING', color: '#aef', icon: 'Z' },
        { id: 'gravity', label: 'GRAVITY FLIP', color: '#fa0', icon: 'G' },
        { id: 'minigun', label: 'MINIGUN', color: '#ccc', icon: 'R' },
    ];

    function resize() {
        W = canvas.width = window.innerWidth;
        H = canvas.height = getViewportHeight();
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        scale = Math.min(W / 390, H / 844);
        player.w = 32 * scale;
        player.h = 32 * scale;
        player.y = H - 100 * scale;
        if (!gameRunning) player.x = W / 2;

        stars = [];
        for (let i = 0; i < 150; i++) {
            stars.push({
                x: Math.random() * W,
                y: Math.random() * H,
                s: Math.random() * 2.5 + 0.3,
                speed: Math.random() * 0.7 + 0.15,
                hue: Math.random() * 60 + 200 // bluish-white
            });
        }
    }

    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', () => setTimeout(resize, 200));
    resize();

    // --- DRAWING FUNCTIONS ---

    function drawShip(x, y, w, h) {
        ctx.save();
        ctx.translate(x, y);

        // Glow under ship
        let grd = ctx.createRadialGradient(0, h * 0.2, 0, 0, h * 0.2, w * 0.8);
        grd.addColorStop(0, 'rgba(68,204,255,0.15)');
        grd.addColorStop(1, 'rgba(68,204,255,0)');
        ctx.fillStyle = grd;
        ctx.fillRect(-w, -h * 0.5, w * 2, h * 1.5);

        // Main body
        ctx.fillStyle = '#4cf';
        ctx.strokeStyle = '#8ef';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(0, -h * 0.65);
        ctx.lineTo(-w * 0.45, h * 0.4);
        ctx.lineTo(-w * 0.2, h * 0.28);
        ctx.lineTo(w * 0.2, h * 0.28);
        ctx.lineTo(w * 0.45, h * 0.4);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Cockpit
        let cockpitGrd = ctx.createRadialGradient(0, -h * 0.2, 0, 0, -h * 0.2, w * 0.15);
        cockpitGrd.addColorStop(0, '#fff');
        cockpitGrd.addColorStop(1, '#4cf');
        ctx.fillStyle = cockpitGrd;
        ctx.beginPath();
        ctx.arc(0, -h * 0.2, w * 0.12, 0, Math.PI * 2);
        ctx.fill();

        // Wings
        ctx.fillStyle = '#08f';
        ctx.beginPath();
        ctx.moveTo(-w * 0.45, h * 0.4);
        ctx.lineTo(-w * 0.65, h * 0.5);
        ctx.lineTo(-w * 0.2, h * 0.28);
        ctx.closePath();
        ctx.fill();
        ctx.beginPath();
        ctx.moveTo(w * 0.45, h * 0.4);
        ctx.lineTo(w * 0.65, h * 0.5);
        ctx.lineTo(w * 0.2, h * 0.28);
        ctx.closePath();
        ctx.fill();

        // Thruster flames (double)
        let flicker = Math.random();
        let flameH = h * (0.4 + flicker * 0.35);
        // Left thruster
        ctx.fillStyle = `hsl(${25 + flicker * 25}, 100%, ${55 + flicker * 30}%)`;
        ctx.beginPath();
        ctx.moveTo(-w * 0.15, h * 0.28);
        ctx.lineTo(-w * 0.05, h * 0.28 + flameH);
        ctx.lineTo(w * 0.02, h * 0.28);
        ctx.closePath();
        ctx.fill();
        // Right thruster
        ctx.beginPath();
        ctx.moveTo(w * 0.15, h * 0.28);
        ctx.lineTo(w * 0.05, h * 0.28 + flameH * 0.9);
        ctx.lineTo(-w * 0.02, h * 0.28);
        ctx.closePath();
        ctx.fill();
        // Inner white core
        ctx.fillStyle = `rgba(255,255,200,${0.5 + flicker * 0.5})`;
        ctx.beginPath();
        ctx.moveTo(-w * 0.08, h * 0.28);
        ctx.lineTo(-w * 0.02, h * 0.28 + flameH * 0.5);
        ctx.lineTo(w * 0.04, h * 0.28);
        ctx.closePath();
        ctx.fill();

        // Shield effect
        if (currentPowerUp === 'shield' && shieldHP > 0) {
            ctx.strokeStyle = `rgba(0,255,0,${0.3 + Math.sin(frameCount * 0.15) * 0.2})`;
            ctx.lineWidth = 2 * scale;
            ctx.beginPath();
            ctx.arc(0, 0, w * 0.85, 0, Math.PI * 2);
            ctx.stroke();
            // second ring
            ctx.strokeStyle = `rgba(0,255,0,${0.15 + Math.sin(frameCount * 0.1 + 1) * 0.1})`;
            ctx.beginPath();
            ctx.arc(0, 0, w * 0.95, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();
    }

    // Enemy types
    const ENEMY_TYPES = [
        { // Bug
            color: '#f44', color2: '#f88',
            draw(x, y, w, h, t) {
                ctx.save(); ctx.translate(x, y);
                // Glow
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6 * scale;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, w * 0.5, h * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-w * 0.2, -h * 0.15, w * 0.12, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(w * 0.2, -h * 0.15, w * 0.12, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#000';
                ctx.beginPath(); ctx.arc(-w * 0.2, -h * 0.15, w * 0.07, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(w * 0.2, -h * 0.15, w * 0.07, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = this.color2;
                let flap = Math.sin(t * 0.12) * 0.4;
                ctx.beginPath();
                ctx.ellipse(-w * 0.6, 0, w * 0.24, h * 0.32, flap, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(w * 0.6, 0, w * 0.24, h * 0.32, -flap, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            },
            hp: 1, score: 100
        },
        { // Bee
            color: '#ff0', color2: '#fa0',
            draw(x, y, w, h, t) {
                ctx.save(); ctx.translate(x, y);
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 5 * scale;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -h * 0.5);
                ctx.lineTo(w * 0.5, 0);
                ctx.lineTo(w * 0.3, h * 0.5);
                ctx.lineTo(-w * 0.3, h * 0.5);
                ctx.lineTo(-w * 0.5, 0);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#000';
                ctx.fillRect(-w * 0.3, -h * 0.1, w * 0.6, h * 0.1);
                ctx.fillRect(-w * 0.3, h * 0.12, w * 0.6, h * 0.1);
                ctx.fillStyle = '#f00';
                ctx.beginPath(); ctx.arc(-w * 0.18, -h * 0.22, w * 0.1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(w * 0.18, -h * 0.22, w * 0.1, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            },
            hp: 1, score: 150
        },
        { // Boss
            color: '#0f0', color2: '#0a0',
            draw(x, y, w, h, t) {
                ctx.save(); ctx.translate(x, y);
                let bw = w * 1.3, bh = h * 1.3;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 8 * scale;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(0, 0, bw * 0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.fillStyle = this.color2;
                ctx.beginPath();
                ctx.moveTo(-bw * 0.3, -bh * 0.3);
                ctx.lineTo(-bw * 0.55, -bh * 0.75);
                ctx.lineTo(-bw * 0.12, -bh * 0.3);
                ctx.closePath();
                ctx.fill();
                ctx.beginPath();
                ctx.moveTo(bw * 0.3, -bh * 0.3);
                ctx.lineTo(bw * 0.55, -bh * 0.75);
                ctx.lineTo(bw * 0.12, -bh * 0.3);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-bw * 0.17, -bh * 0.08, bw * 0.14, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(bw * 0.17, -bh * 0.08, bw * 0.14, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#f0f';
                ctx.beginPath(); ctx.arc(-bw * 0.17, -bh * 0.08, bw * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(bw * 0.17, -bh * 0.08, bw * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            },
            hp: 3, score: 400
        },
        { // Stealth - fades in and out
            color: '#88f', color2: '#aaf',
            draw(x, y, w, h, t) {
                ctx.save(); ctx.translate(x, y);
                let alpha = 0.3 + Math.abs(Math.sin(t * 0.03)) * 0.7;
                ctx.globalAlpha = alpha;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6 * scale;
                ctx.fillStyle = this.color;
                // Diamond body
                ctx.beginPath();
                ctx.moveTo(0, -h * 0.55);
                ctx.lineTo(w * 0.55, 0);
                ctx.lineTo(0, h * 0.55);
                ctx.lineTo(-w * 0.55, 0);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                // Inner cross
                ctx.fillStyle = this.color2;
                ctx.fillRect(-w * 0.08, -h * 0.35, w * 0.16, h * 0.7);
                ctx.fillRect(-w * 0.35, -h * 0.08, w * 0.7, h * 0.16);
                // Eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(-w * 0.2, -h * 0.1, w * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(w * 0.2, -h * 0.1, w * 0.08, 0, Math.PI * 2); ctx.fill();
                ctx.globalAlpha = 1;
                ctx.restore();
            },
            hp: 1, score: 250
        },
        { // Bomber - drops cluster bombs when diving
            color: '#f80', color2: '#a50',
            draw(x, y, w, h, t) {
                ctx.save(); ctx.translate(x, y);
                let bw = w * 1.15, bh = h * 1.15;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 6 * scale;
                // Chunky hexagonal body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(0, -bh * 0.5);
                ctx.lineTo(bw * 0.45, -bh * 0.25);
                ctx.lineTo(bw * 0.45, bh * 0.25);
                ctx.lineTo(0, bh * 0.5);
                ctx.lineTo(-bw * 0.45, bh * 0.25);
                ctx.lineTo(-bw * 0.45, -bh * 0.25);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
                // Bomb bay markings
                ctx.fillStyle = this.color2;
                ctx.fillRect(-bw * 0.25, bh * 0.1, bw * 0.5, bh * 0.15);
                // Angry eyes
                ctx.fillStyle = '#f00';
                ctx.beginPath(); ctx.arc(-bw * 0.15, -bh * 0.12, bw * 0.1, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(bw * 0.15, -bh * 0.12, bw * 0.1, 0, Math.PI * 2); ctx.fill();
                ctx.fillStyle = '#ff0';
                ctx.beginPath(); ctx.arc(-bw * 0.15, -bh * 0.12, bw * 0.05, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(bw * 0.15, -bh * 0.12, bw * 0.05, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
            },
            hp: 2, score: 300
        }
    ];

    function spawnWave() {
        enemies = [];
        const rows = Math.min(3 + Math.floor(stage / 2), 5);
        const cols = Math.min(5 + Math.floor(stage / 3), 8);
        const ew = 26 * scale;
        const eh = 24 * scale;
        const maxW = W - 40 * scale;
        const gapX = cols > 1 ? Math.min(ew * 1.8, maxW / (cols - 1)) : 0;
        const gapY = eh * 1.6;
        const startX = W / 2 - (cols - 1) * gapX / 2;
        const startY = 50 * scale + 30;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                let type;
                if (r === 0) {
                    type = 2; // Boss row
                } else if (r === 1) {
                    // Stealth enemies appear from stage 3+, mixed with Bees
                    type = (stage >= 3 && Math.random() < 0.35) ? 3 : 1;
                } else if (r === rows - 1 && stage >= 4) {
                    // Bomber enemies appear in last row from stage 4+
                    type = Math.random() < 0.3 ? 4 : 0;
                } else {
                    type = 0; // Bugs
                }
                const et = ENEMY_TYPES[type];
                enemies.push({
                    x: startX + c * gapX,
                    y: startY + r * gapY,
                    w: ew, h: eh,
                    type,
                    hp: et.hp,
                    homeX: startX + c * gapX,
                    homeY: startY + r * gapY,
                    state: 'formation',
                    diveTimer: 200 + Math.random() * 600,
                    diveProgress: 0,
                    diveStartX: 0,
                    diveStartY: 0,
                    alive: true
                });
            }
        }
    }

    function spawnParticles(x, y, color, count, spread) {
        spread = spread || 6;
        for (let i = 0; i < count; i++) {
            let angle = Math.random() * Math.PI * 2;
            let speed = Math.random() * spread + 1;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed,
                vy: Math.sin(angle) * speed,
                life: 20 + Math.random() * 25,
                maxLife: 45,
                color,
                size: (1.5 + Math.random() * 3) * scale
            });
        }
    }

    function spawnExplosion(x, y, color, size) {
        // Ring of particles
        for (let i = 0; i < 16; i++) {
            let angle = (i / 16) * Math.PI * 2;
            let speed = 3 + Math.random() * 3;
            particles.push({
                x, y,
                vx: Math.cos(angle) * speed * (size || 1),
                vy: Math.sin(angle) * speed * (size || 1),
                life: 30 + Math.random() * 15,
                maxLife: 45,
                color,
                size: (2 + Math.random() * 2) * scale
            });
        }
        // Core flash
        particles.push({
            x, y, vx: 0, vy: 0,
            life: 8, maxLife: 8,
            color: '#fff',
            size: 20 * scale * (size || 1)
        });
        screenShake = Math.max(screenShake, 4 * (size || 1));
    }

    function spawnFloatingText(x, y, text, color) {
        floatingTexts.push({ x, y, text, color, life: 50, maxLife: 50 });
    }

    function dropPowerUp(x, y) {
        // 4% chance to drop a power-up
        if (Math.random() > 0.04) return;
        let type = POWERUP_TYPES[Math.floor(Math.random() * POWERUP_TYPES.length)];
        powerUps.push({
            x, y,
            vy: 1.5 * scale,
            type: type.id,
            color: type.color,
            label: type.label,
            icon: type.icon,
            size: 14 * scale,
            bobPhase: Math.random() * Math.PI * 2
        });
    }

    let formationX = 0;
    let formationDir = 1;

    function update() {
        frameCount++;

        // Screen shake decay
        if (screenShake > 0) screenShake *= 0.85;
        if (screenShake < 0.3) screenShake = 0;
        if (invincibleTimer > 0) invincibleTimer--;
        if (damageFlash > 0) damageFlash--;

        // Combo timer
        if (comboTimer > 0) {
            comboTimer--;
            if (comboTimer <= 0) comboCount = 0;
        }

        // Power-up timer
        if (currentPowerUp && currentPowerUp !== 'shield') {
            powerUpTimer--;
            if (powerUpTimer <= 0) {
                currentPowerUp = null;
                powerUpHud.style.opacity = '0';
            } else {
                // Flash warning when about to expire
                if (powerUpTimer < 90 && powerUpTimer % 15 < 8) {
                    powerUpHud.style.opacity = '0.4';
                } else {
                    powerUpHud.style.opacity = '1';
                }
            }
        }

        // Stars scroll
        for (let s of stars) {
            s.y += s.speed * scale;
            if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
        }

        // Formation sway
        const maxSway = 30 * scale;
        formationX += formationDir * 0.5 * scale;
        if (Math.abs(formationX) > maxSway) formationDir *= -1;

        // --- ENEMIES ---
        let aliveCount = 0;
        let timeWarpActive = currentPowerUp === 'timewarp';
        let enemySpeedMult = timeWarpActive ? 0.35 : 1;
        for (let e of enemies) {
            if (!e.alive) continue;
            aliveCount++;

            if (e.state === 'formation') {
                e.x = e.homeX + formationX;
                e.y = e.homeY + Math.sin(frameCount * 0.02 + e.homeX * 0.01) * 3 * scale;
                e.diveTimer -= enemySpeedMult;
                if (e.diveTimer <= 0 && Math.random() < (0.008 + stage * 0.002) * enemySpeedMult) {
                    e.state = 'diving';
                    e.diveProgress = 0;
                    e.diveStartX = e.x;
                    e.diveStartY = e.y;
                }
                if (Math.random() < (0.001 + stage * 0.0005) * enemySpeedMult) {
                    enemyBullets.push({
                        x: e.x, y: e.y + e.h / 2,
                        vy: (2.5 + stage * 0.2) * scale,
                        vx: (Math.random() - 0.5) * 0.5 * scale
                    });
                }
                // Boss enemies rarely launch homing missiles (stage 2+)
                if (e.type === 2 && stage >= 2 && Math.random() < 0.0004 * stage * enemySpeedMult) {
                    enemyBullets.push({
                        x: e.x, y: e.y + e.h / 2,
                        vy: 2 * scale,
                        vx: 0,
                        homing: true,
                        homingLife: 180,
                        speed: 2.5 * scale
                    });
                }
            } else if (e.state === 'diving') {
                e.diveProgress += (0.012 + stage * 0.0015) * enemySpeedMult;
                e.x = e.diveStartX + Math.sin(e.diveProgress * 3) * 70 * scale;
                e.y = e.diveStartY + e.diveProgress * 280 * scale;
                e.x = Math.max(e.w, Math.min(W - e.w, e.x));
                if (Math.random() < 0.025 * enemySpeedMult) {
                    enemyBullets.push({
                        x: e.x, y: e.y + e.h / 2,
                        vy: 3.5 * scale,
                        vx: (player.x - e.x) * 0.008
                    });
                }
                // Bomber drops cluster bombs while diving
                if (e.type === 4 && Math.random() < 0.04 * enemySpeedMult) {
                    for (let a = -1; a <= 1; a++) {
                        enemyBullets.push({
                            x: e.x + a * 8 * scale,
                            y: e.y + e.h / 2,
                            vy: (2 + Math.random()) * scale,
                            vx: a * 1.5 * scale,
                            cluster: true
                        });
                    }
                }
                if (e.y > H + 50) {
                    e.state = 'returning';
                    e.x = e.homeX + formationX;
                    e.y = -30;
                }
            } else if (e.state === 'returning') {
                e.x += (e.homeX + formationX - e.x) * 0.05;
                e.y += (e.homeY - e.y) * 0.05;
                if (Math.abs(e.y - e.homeY) < 3) {
                    e.state = 'formation';
                    e.diveTimer = 200 + Math.random() * 400;
                }
            }
        }

        // Next stage
        if (aliveCount === 0 && gameRunning) {
            stage++;
            document.getElementById('stageHud').textContent = 'STAGE ' + stage;
            spawnWave();
            spawnFloatingText(W / 2, H / 2, 'STAGE ' + stage, '#ff0');
        }

        // --- PLAYER BULLETS ---
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (b.drunk) {
                b.drunkPhase += 0.15;
                b.vx = Math.sin(b.drunkPhase) * 4 * scale;
            }
            b.x += (b.vx || 0);
            b.y += (b.vy || -7 * scale);
            if (b.y < -10 || b.y > H + 10 || b.x < -10 || b.x > W + 10) { bullets.splice(i, 1); continue; }

            let removed = false;
            for (let e of enemies) {
                if (!e.alive) continue;
                // Stealth enemies can't be hit when mostly invisible
                if (e.type === 3) {
                    let alpha = 0.3 + Math.abs(Math.sin(frameCount * 0.03)) * 0.7;
                    if (alpha < 0.5) continue;
                }
                if (Math.abs(b.x - e.x) < e.w * 0.55 && Math.abs(b.y - e.y) < e.h * 0.55) {
                    if (!b.pierce) {
                        bullets.splice(i, 1);
                        removed = true;
                    }
                    hitEnemy(e);
                    break;
                }
            }
            if (removed) continue;
        }

        // --- LASERS ---
        for (let i = lasers.length - 1; i >= 0; i--) {
            let l = lasers[i];
            l.life--;
            if (l.life <= 0) { lasers.splice(i, 1); continue; }
            // Laser damages all enemies it touches
            for (let e of enemies) {
                if (!e.alive) continue;
                if (Math.abs(l.x - e.x) < l.width / 2 + e.w * 0.4 && e.y < l.y && e.y > 0) {
                    if (frameCount % 3 === 0) { // damage every 3 frames
                        hitEnemy(e);
                    }
                }
            }
        }

        // --- MISSILES ---
        for (let i = missiles.length - 1; i >= 0; i--) {
            let m = missiles[i];
            // Find nearest enemy
            let nearest = null;
            let nearestDist = Infinity;
            for (let e of enemies) {
                if (!e.alive) continue;
                let d = Math.hypot(e.x - m.x, e.y - m.y);
                if (d < nearestDist) { nearestDist = d; nearest = e; }
            }
            if (nearest) {
                let angle = Math.atan2(nearest.y - m.y, nearest.x - m.x);
                let turnSpeed = 0.08;
                let diff = angle - m.angle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                m.angle += Math.sign(diff) * Math.min(Math.abs(diff), turnSpeed);
            }
            let spd = 5 * scale;
            m.vx = Math.cos(m.angle) * spd;
            m.vy = Math.sin(m.angle) * spd;
            m.x += m.vx;
            m.y += m.vy;
            m.life--;
            // Trail
            if (frameCount % 2 === 0) {
                particles.push({
                    x: m.x, y: m.y,
                    vx: (Math.random() - 0.5) * 1.5,
                    vy: (Math.random() - 0.5) * 1.5 + 1,
                    life: 12, maxLife: 12,
                    color: '#f0f',
                    size: 3 * scale
                });
            }

            if (m.life <= 0 || m.x < -20 || m.x > W + 20 || m.y < -20 || m.y > H + 20) {
                missiles.splice(i, 1); continue;
            }

            for (let e of enemies) {
                if (!e.alive) continue;
                if (Math.abs(m.x - e.x) < e.w * 0.6 && Math.abs(m.y - e.y) < e.h * 0.6) {
                    missiles.splice(i, 1);
                    hitEnemy(e);
                    spawnExplosion(e.x, e.y, '#f0f', 0.7);
                    break;
                }
            }
        }

        // --- BLACK HOLES ---
        for (let i = blackHoles.length - 1; i >= 0; i--) {
            let bh = blackHoles[i];
            if (!bh.deployed) {
                bh.y += bh.vy;
                if (bh.y < H * 0.35) { bh.deployed = true; bh.vy = 0; }
            }
            if (bh.deployed) {
                bh.radius = Math.min(bh.radius + 1.5 * scale, bh.maxRadius);
                // Pull enemies toward center
                for (let e of enemies) {
                    if (!e.alive) continue;
                    let dx = bh.x - e.x, dy = bh.y - e.y;
                    let dist = Math.hypot(dx, dy);
                    if (dist < bh.radius * 2.5 && dist > 0) {
                        let pull = (bh.radius * 2.5 - dist) / (bh.radius * 2.5) * 2 * scale;
                        e.x += (dx / dist) * pull;
                        e.y += (dy / dist) * pull;
                    }
                    if (dist < 10 * scale) {
                        hitEnemy(e);
                    }
                }
                // Absorb enemy bullets
                for (let j = enemyBullets.length - 1; j >= 0; j--) {
                    let eb = enemyBullets[j];
                    if (Math.hypot(eb.x - bh.x, eb.y - bh.y) < bh.radius) {
                        enemyBullets.splice(j, 1);
                    }
                }
            }
            bh.life--;
            if (bh.life <= 0) {
                spawnExplosion(bh.x, bh.y, '#609', 2);
                screenShake = 6;
                // Damage nearby enemies on collapse
                for (let e of enemies) {
                    if (!e.alive) continue;
                    if (Math.hypot(e.x - bh.x, e.y - bh.y) < bh.maxRadius * 1.5) {
                        hitEnemy(e);
                    }
                }
                blackHoles.splice(i, 1);
            }
        }

        // --- BOOMERANGS ---
        for (let i = boomerangs.length - 1; i >= 0; i--) {
            let bm = boomerangs[i];
            bm.t += 0.02;
            // Elliptical path
            let range = 180 * scale;
            bm.x = bm.startX + Math.sin(bm.t * Math.PI) * range * bm.dir;
            bm.y = bm.startY - Math.sin(bm.t * Math.PI) * range * 1.2;
            // Hit enemies
            for (let e of enemies) {
                if (!e.alive || bm.hit.has(e)) continue;
                if (Math.abs(bm.x - e.x) < e.w * 0.6 + 10 * scale && Math.abs(bm.y - e.y) < e.h * 0.6 + 10 * scale) {
                    bm.hit.add(e);
                    hitEnemy(e);
                    spawnParticles(e.x, e.y, '#f55', 6, 3);
                }
            }
            if (bm.t >= 1) {
                boomerangs.splice(i, 1);
            }
        }

        // --- LIGHTNING BOLTS (visual only) ---
        for (let i = lightningBolts.length - 1; i >= 0; i--) {
            lightningBolts[i].life--;
            if (lightningBolts[i].life <= 0) lightningBolts.splice(i, 1);
        }

        // --- GRAVITY EFFECT on enemy bullets ---
        if (currentPowerUp === 'gravity') {
            gravityFlipped = true;
            for (let eb of enemyBullets) {
                eb.vy *= 0.95; // slow them down
                eb.vy -= 0.15 * scale; // push them back up
            }
        } else {
            gravityFlipped = false;
        }

        // --- POWER-UPS ---
        for (let i = powerUps.length - 1; i >= 0; i--) {
            let p = powerUps[i];
            p.y += p.vy;
            p.bobPhase += 0.06;
            if (p.y > H + 20) { powerUps.splice(i, 1); continue; }
            // Collect
            if (Math.abs(p.x - player.x) < player.w * 0.7 + p.size && Math.abs(p.y - player.y) < player.h * 0.7 + p.size) {
                powerUps.splice(i, 1);
                activatePowerUp(p.type, p.label, p.color);
                spawnParticles(p.x, p.y, p.color, 12, 4);
                screenShake = 3;
            }
        }

        // --- ENEMY BULLETS ---
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
            let b = enemyBullets[i];
            // Homing missile behavior
            if (b.homing) {
                b.homingLife--;
                if (b.homingLife <= 0) { enemyBullets.splice(i, 1); continue; }
                let angle = Math.atan2(player.y - b.y, player.x - b.x);
                let curAngle = Math.atan2(b.vy, b.vx);
                let diff = angle - curAngle;
                while (diff > Math.PI) diff -= Math.PI * 2;
                while (diff < -Math.PI) diff += Math.PI * 2;
                curAngle += Math.sign(diff) * Math.min(Math.abs(diff), 0.04);
                b.vx = Math.cos(curAngle) * b.speed;
                b.vy = Math.sin(curAngle) * b.speed;
                // Trail particles
                if (frameCount % 3 === 0) {
                    particles.push({
                        x: b.x, y: b.y,
                        vx: (Math.random() - 0.5), vy: (Math.random() - 0.5),
                        life: 10, maxLife: 10, color: '#f44', size: 2 * scale
                    });
                }
            }
            b.y += b.vy;
            b.x += (b.vx || 0);
            if (b.y > H + 10 || b.y < -10 || b.x < -10 || b.x > W + 10) { enemyBullets.splice(i, 1); continue; }
            if (Math.abs(b.x - player.x) < player.w * 0.4 && Math.abs(b.y - player.y) < player.h * 0.4) {
                enemyBullets.splice(i, 1);
                playerHit();
            }
        }

        // Enemy-player collision
        for (let e of enemies) {
            if (!e.alive) continue;
            if (Math.abs(e.x - player.x) < (e.w + player.w) * 0.45 && Math.abs(e.y - player.y) < (e.h + player.h) * 0.45) {
                e.alive = false;
                spawnExplosion(e.x, e.y, ENEMY_TYPES[e.type].color, 1);
                playerHit();
            }
        }

        // Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.96;
            p.vy *= 0.96;
            p.life--;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Floating texts
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let t = floatingTexts[i];
            t.y -= 1;
            t.life--;
            if (t.life <= 0) floatingTexts.splice(i, 1);
        }
    }

    function hitEnemy(e) {
        e.hp--;
        if (e.hp <= 0) {
            e.alive = false;
            let baseScore = ENEMY_TYPES[e.type].score;
            comboCount++;
            comboTimer = 60;
            let multiplier = Math.min(comboCount, 8);
            let pts = baseScore * multiplier;
            score += pts;
            document.getElementById('scoreHud').textContent = 'SCORE: ' + score;
            spawnExplosion(e.x, e.y, ENEMY_TYPES[e.type].color, e.type === 2 ? 1.5 : 1);
            if (multiplier > 1) {
                spawnFloatingText(e.x, e.y - 15, pts + ' x' + multiplier, '#ff0');
            } else {
                spawnFloatingText(e.x, e.y - 15, '+' + pts, '#fff');
            }
            dropPowerUp(e.x, e.y);
        } else {
            spawnParticles(e.x, e.y, '#fff', 5, 3);
        }
    }

    function activatePowerUp(type, label, color) {
        currentPowerUp = type;
        powerUpTimer = POWERUP_DURATION;
        powerUpHud.textContent = label;
        powerUpHud.style.color = color;
        powerUpHud.style.opacity = '1';
        if (type === 'shield') {
            shieldHP = 2;
        }
        spawnFloatingText(player.x, player.y - 40, label + '!', color);
    }

    function playerHit() {
        if (invincibleTimer > 0) return;
        if (currentPowerUp === 'shield' && shieldHP > 0) {
            shieldHP--;
            screenShake = 5;
            spawnParticles(player.x, player.y, '#0f0', 10, 5);
            if (shieldHP <= 0) {
                currentPowerUp = null;
                powerUpHud.style.opacity = '0';
            }
            return;
        }
        lives--;
        spawnExplosion(player.x, player.y, '#f44', 1.5);
        screenShake = 12;
        updateLivesHud(true);
        damageFlash = 8;
        if (lives <= 0) {
            gameOver();
        } else {
            player.x = W / 2;
            invincibleTimer = 90; // ~1.5 seconds of invincibility
        }
    }

    function updateLivesHud(wasHit) {
        const el = document.getElementById('lives');
        el.textContent = '♥'.repeat(Math.max(0, lives));
        if (wasHit) {
            el.classList.add('hit');
            setTimeout(() => el.classList.remove('hit'), 300);
        }
    }

    // --- FIRE LOGIC ---
    function fire() {
        let now = Date.now();
        let rate = (currentPowerUp === 'minigun') ? FIRE_RATE * 0.25 : FIRE_RATE;
        if (now - lastFireTime < rate) return;
        lastFireTime = now;

        if (currentPowerUp === 'spread') {
            // 3-way spread
            for (let a = -1; a <= 1; a++) {
                let angle = -Math.PI / 2 + a * 0.22;
                bullets.push({
                    x: player.x,
                    y: player.y - player.h * 0.5,
                    vx: Math.cos(angle) * 7 * scale,
                    vy: Math.sin(angle) * 7 * scale
                });
            }
        } else if (currentPowerUp === 'laser') {
            // Big continuous laser beam
            lasers.push({
                x: player.x,
                y: player.y,
                width: 18 * scale,
                life: 8
            });
        } else if (currentPowerUp === 'missile') {
            // Fire two homing missiles
            for (let side of [-1, 1]) {
                missiles.push({
                    x: player.x + side * player.w * 0.3,
                    y: player.y - player.h * 0.3,
                    vx: side * 1.5 * scale,
                    vy: -3 * scale,
                    angle: -Math.PI / 2 + side * 0.3,
                    life: 120
                });
            }
        } else if (currentPowerUp === 'pierce') {
            // Piercing shot - single powerful bullet that passes through enemies
            bullets.push({
                x: player.x,
                y: player.y - player.h * 0.5,
                vy: -9 * scale,
                pierce: true
            });
        } else if (currentPowerUp === 'timewarp') {
            // Normal shot while time warp is active (slow effect handled in update)
            bullets.push({
                x: player.x - 5 * scale,
                y: player.y - player.h * 0.5,
                vy: -8 * scale
            });
            bullets.push({
                x: player.x + 5 * scale,
                y: player.y - player.h * 0.5,
                vy: -8 * scale
            });
        } else if (currentPowerUp === 'blackhole') {
            // Launch a black hole projectile that sucks enemies in
            blackHoles.push({
                x: player.x,
                y: player.y - player.h * 0.5,
                vy: -4 * scale,
                life: 180,
                radius: 0,
                maxRadius: 60 * scale,
                deployed: false
            });
        } else if (currentPowerUp === 'boomerang') {
            // Fire a boomerang that curves out and comes back
            boomerangs.push({
                x: player.x,
                y: player.y - player.h * 0.5,
                startX: player.x,
                startY: player.y,
                t: 0,
                dir: (Math.random() < 0.5) ? -1 : 1,
                hit: new Set()
            });
        } else if (currentPowerUp === 'drunk') {
            // Fire wobbly zigzag bullets
            for (let i = 0; i < 3; i++) {
                bullets.push({
                    x: player.x + (i - 1) * 10 * scale,
                    y: player.y - player.h * 0.5,
                    vy: -7 * scale,
                    vx: 0,
                    drunk: true,
                    drunkPhase: Math.random() * Math.PI * 2,
                    pierce: true
                });
            }
        } else if (currentPowerUp === 'lightning') {
            // Zap a chain of enemies
            let targets = [];
            let remaining = enemies.filter(e => e.alive);
            if (remaining.length > 0) {
                let current = remaining.reduce((closest, e) => {
                    let d = Math.hypot(e.x - player.x, e.y - player.y);
                    let dc = Math.hypot(closest.x - player.x, closest.y - player.y);
                    return d < dc ? e : closest;
                }, remaining[0]);
                let used = new Set();
                for (let chain = 0; chain < 5 && current; chain++) {
                    targets.push({ x: current.x, y: current.y });
                    current.hp -= 1;
                    if (current.hp <= 0) {
                        current.alive = false;
                        score += ENEMY_TYPES[current.type].score;
                        spawnExplosion(current.x, current.y, ENEMY_TYPES[current.type].color, 1);
                        dropPowerUp(current.x, current.y);
                    }
                    used.add(current);
                    let next = null, bestDist = Infinity;
                    for (let e of remaining) {
                        if (!e.alive || used.has(e)) continue;
                        let d = Math.hypot(e.x - current.x, e.y - current.y);
                        if (d < bestDist && d < 150 * scale) { bestDist = d; next = e; }
                    }
                    current = next;
                }
                if (targets.length > 0) {
                    lightningBolts.push({
                        points: [{ x: player.x, y: player.y - player.h * 0.5 }, ...targets],
                        life: 12
                    });
                    screenShake = 4;
                }
            }
        } else if (currentPowerUp === 'gravity') {
            // Shoot upward and downward simultaneously
            bullets.push({
                x: player.x,
                y: player.y - player.h * 0.5,
                vy: -9 * scale
            });
            bullets.push({
                x: player.x - 12 * scale,
                y: player.y - player.h * 0.5,
                vx: -3 * scale,
                vy: -7 * scale
            });
            bullets.push({
                x: player.x + 12 * scale,
                y: player.y - player.h * 0.5,
                vx: 3 * scale,
                vy: -7 * scale
            });
            // Gravity pulls enemy bullets down faster (handled in update)
        } else if (currentPowerUp === 'minigun') {
            // Rapid inaccurate spray
            minigunAngle += 0.15;
            let spread = Math.sin(minigunAngle) * 0.3;
            bullets.push({
                x: player.x,
                y: player.y - player.h * 0.5,
                vx: Math.sin(spread) * 10 * scale,
                vy: -Math.cos(spread) * 10 * scale
            });
        } else {
            // Normal double shot
            bullets.push({
                x: player.x - 5 * scale,
                y: player.y - player.h * 0.5,
                vy: -8 * scale
            });
            bullets.push({
                x: player.x + 5 * scale,
                y: player.y - player.h * 0.5,
                vy: -8 * scale
            });
        }
    }

    // --- DRAW ---
    function draw() {
        ctx.save();

        // Screen shake
        if (screenShake > 0) {
            ctx.translate(
                (Math.random() - 0.5) * screenShake * 2,
                (Math.random() - 0.5) * screenShake * 2
            );
        }

        // Background - deep space gradient
        let bgGrd = ctx.createLinearGradient(0, 0, 0, H);
        bgGrd.addColorStop(0, '#050510');
        bgGrd.addColorStop(0.5, '#0a0a20');
        bgGrd.addColorStop(1, '#080818');
        ctx.fillStyle = bgGrd;
        ctx.fillRect(-5, -5, W + 10, H + 10);

        // Stars
        for (let s of stars) {
            let alpha = 0.3 + Math.sin(frameCount * 0.025 + s.x * 0.1) * 0.3;
            let sz = s.s * scale;
            if (sz > 1.5 * scale) {
                // Bigger stars have a glow
                ctx.fillStyle = `hsla(${s.hue}, 60%, 80%, ${alpha * 0.3})`;
                ctx.fillRect(s.x - sz, s.y - sz, sz * 3, sz * 3);
            }
            ctx.fillStyle = `hsla(${s.hue}, 40%, 90%, ${alpha})`;
            ctx.fillRect(s.x, s.y, sz, sz);
        }

        // Time warp visual overlay
        if (currentPowerUp === 'timewarp') {
            ctx.fillStyle = `rgba(100,0,200,${0.06 + Math.sin(frameCount * 0.05) * 0.03})`;
            ctx.fillRect(-5, -5, W + 10, H + 10);
        }

        // Lasers (draw behind everything)
        for (let l of lasers) {
            let alpha = l.life / 8;
            // Outer glow
            let lgrd = ctx.createLinearGradient(l.x - l.width, 0, l.x + l.width, 0);
            lgrd.addColorStop(0, `rgba(0,255,255,0)`);
            lgrd.addColorStop(0.3, `rgba(0,255,255,${alpha * 0.3})`);
            lgrd.addColorStop(0.5, `rgba(255,255,255,${alpha * 0.8})`);
            lgrd.addColorStop(0.7, `rgba(0,255,255,${alpha * 0.3})`);
            lgrd.addColorStop(1, `rgba(0,255,255,0)`);
            ctx.fillStyle = lgrd;
            ctx.fillRect(l.x - l.width * 1.5, 0, l.width * 3, l.y);
            // Inner core
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.fillRect(l.x - l.width * 0.3, 0, l.width * 0.6, l.y);
        }

        // Player
        if (gameRunning && lives > 0) {
            if (invincibleTimer > 0) {
                ctx.globalAlpha = (Math.floor(invincibleTimer / 4) % 2) ? 1.0 : 0.25;
            }
            drawShip(player.x, player.y, player.w, player.h);
            ctx.globalAlpha = 1;
        }

        // Player bullets
        for (let b of bullets) {
            if (b.drunk) {
                // Drunk wobbly green bullets
                ctx.shadowColor = '#5f5';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#5f5';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 4 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 1.5 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            } else if (b.pierce) {
                // Piercing shot - bright wide bolt
                ctx.shadowColor = '#ff4';
                ctx.shadowBlur = 14;
                ctx.fillStyle = '#ff4';
                ctx.fillRect(b.x - 3 * scale, b.y - 10 * scale, 6 * scale, 20 * scale);
                ctx.fillStyle = '#fff';
                ctx.fillRect(b.x - 1.5 * scale, b.y - 8 * scale, 3 * scale, 16 * scale);
                ctx.shadowBlur = 0;
            } else {
                ctx.shadowColor = '#ff0';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ff0';
                ctx.fillRect(b.x - 1.5 * scale, b.y - 7 * scale, 3 * scale, 14 * scale);
                ctx.fillStyle = '#fff';
                ctx.fillRect(b.x - 0.7 * scale, b.y - 5 * scale, 1.4 * scale, 10 * scale);
                ctx.shadowBlur = 0;
            }
        }

        // Missiles
        for (let m of missiles) {
            ctx.save();
            ctx.translate(m.x, m.y);
            ctx.rotate(m.angle + Math.PI / 2);
            // Body
            ctx.fillStyle = '#f0f';
            ctx.beginPath();
            ctx.moveTo(0, -8 * scale);
            ctx.lineTo(-3 * scale, 5 * scale);
            ctx.lineTo(3 * scale, 5 * scale);
            ctx.closePath();
            ctx.fill();
            // Fins
            ctx.fillStyle = '#a0a';
            ctx.beginPath();
            ctx.moveTo(-3 * scale, 3 * scale);
            ctx.lineTo(-6 * scale, 7 * scale);
            ctx.lineTo(-2 * scale, 5 * scale);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(3 * scale, 3 * scale);
            ctx.lineTo(6 * scale, 7 * scale);
            ctx.lineTo(2 * scale, 5 * scale);
            ctx.closePath();
            ctx.fill();
            // Tip glow
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(0, -6 * scale, 1.5 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Black holes
        for (let bh of blackHoles) {
            ctx.save();
            let alpha = Math.min(bh.life / 30, 1);
            // Swirling accretion disk
            for (let ring = 3; ring >= 0; ring--) {
                let r = bh.radius * (0.5 + ring * 0.4);
                ctx.beginPath();
                ctx.arc(bh.x, bh.y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(${80 + ring * 30},0,${120 + ring * 30},${alpha * 0.15})`;
                ctx.fill();
            }
            // Spinning lines
            for (let s = 0; s < 6; s++) {
                let a = frameCount * 0.05 + s * Math.PI / 3;
                ctx.beginPath();
                ctx.moveTo(bh.x, bh.y);
                ctx.lineTo(bh.x + Math.cos(a) * bh.radius, bh.y + Math.sin(a) * bh.radius);
                ctx.strokeStyle = `rgba(160,0,255,${alpha * 0.5})`;
                ctx.lineWidth = 2 * scale;
                ctx.stroke();
            }
            // Core
            ctx.beginPath();
            ctx.arc(bh.x, bh.y, 6 * scale, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(0,0,0,${alpha})`;
            ctx.fill();
            ctx.beginPath();
            ctx.arc(bh.x, bh.y, 8 * scale, 0, Math.PI * 2);
            ctx.strokeStyle = `rgba(160,0,255,${alpha * 0.8})`;
            ctx.lineWidth = 2 * scale;
            ctx.stroke();
            ctx.restore();
        }

        // Boomerangs
        for (let bm of boomerangs) {
            ctx.save();
            ctx.translate(bm.x, bm.y);
            ctx.rotate(bm.t * Math.PI * 6); // spinning
            ctx.fillStyle = '#f55';
            ctx.beginPath();
            ctx.moveTo(0, -10 * scale);
            ctx.quadraticCurveTo(12 * scale, 0, 0, 4 * scale);
            ctx.quadraticCurveTo(-12 * scale, 0, 0, -10 * scale);
            ctx.fill();
            ctx.fillStyle = '#faa';
            ctx.beginPath();
            ctx.arc(0, -3 * scale, 2 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // Lightning bolts
        for (let lb of lightningBolts) {
            let alpha = lb.life / 12;
            ctx.save();
            ctx.strokeStyle = `rgba(170,238,255,${alpha})`;
            ctx.lineWidth = 3 * scale;
            ctx.shadowColor = '#aef';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            for (let p = 0; p < lb.points.length; p++) {
                let pt = lb.points[p];
                if (p === 0) ctx.moveTo(pt.x, pt.y);
                else {
                    // Jagged lightning segments
                    let prev = lb.points[p - 1];
                    let mx = (prev.x + pt.x) / 2 + (Math.random() - 0.5) * 20 * scale;
                    let my = (prev.y + pt.y) / 2 + (Math.random() - 0.5) * 20 * scale;
                    ctx.lineTo(mx, my);
                    ctx.lineTo(pt.x, pt.y);
                }
            }
            ctx.stroke();
            // Bright core
            ctx.strokeStyle = `rgba(255,255,255,${alpha * 0.8})`;
            ctx.lineWidth = 1.5 * scale;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.restore();
        }

        // Gravity flip overlay
        if (currentPowerUp === 'gravity') {
            ctx.fillStyle = `rgba(255,160,0,${0.04 + Math.sin(frameCount * 0.08) * 0.02})`;
            ctx.fillRect(-5, -5, W + 10, H + 10);
        }

        // Enemies
        for (let e of enemies) {
            if (!e.alive) continue;
            ENEMY_TYPES[e.type].draw(e.x, e.y, e.w, e.h, frameCount);
        }

        // Enemy bullets
        for (let b of enemyBullets) {
            if (b.homing) {
                // Enemy homing missile - triangular, red-orange with glow
                ctx.save();
                ctx.translate(b.x, b.y);
                let ang = Math.atan2(b.vy, b.vx) + Math.PI / 2;
                ctx.rotate(ang);
                ctx.shadowColor = '#f40';
                ctx.shadowBlur = 10;
                ctx.fillStyle = '#f40';
                ctx.beginPath();
                ctx.moveTo(0, -7 * scale);
                ctx.lineTo(-4 * scale, 5 * scale);
                ctx.lineTo(4 * scale, 5 * scale);
                ctx.closePath();
                ctx.fill();
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.arc(0, -4 * scale, 1.5 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            } else if (b.cluster) {
                // Cluster bomb - orange square
                ctx.shadowColor = '#f80';
                ctx.shadowBlur = 6;
                ctx.fillStyle = '#f80';
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(frameCount * 0.1);
                ctx.fillRect(-3 * scale, -3 * scale, 6 * scale, 6 * scale);
                ctx.restore();
                ctx.shadowBlur = 0;
            } else {
                ctx.shadowColor = '#f44';
                ctx.shadowBlur = 5;
                ctx.fillStyle = '#f44';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 3.5 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#faa';
                ctx.beginPath();
                ctx.arc(b.x, b.y, 1.5 * scale, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        // Power-ups
        for (let p of powerUps) {
            let bob = Math.sin(p.bobPhase) * 4 * scale;
            let py = p.y + bob;
            // Glow
            ctx.shadowColor = p.color;
            ctx.shadowBlur = 12;
            // Rotating diamond shape
            ctx.save();
            ctx.translate(p.x, py);
            ctx.rotate(frameCount * 0.04);
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.moveTo(0, -p.size);
            ctx.lineTo(p.size, 0);
            ctx.lineTo(0, p.size);
            ctx.lineTo(-p.size, 0);
            ctx.closePath();
            ctx.fill();
            // Icon letter
            ctx.rotate(-frameCount * 0.04);
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${p.size * 1.1}px monospace`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(p.icon, 0, 1);
            ctx.restore();
            ctx.shadowBlur = 0;
        }

        // Particles
        for (let p of particles) {
            let alpha = p.life / p.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            if (p.size > 10 * scale) {
                // Big flash particle
                let grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size);
                grd.addColorStop(0, 'rgba(255,255,255,' + alpha + ')');
                grd.addColorStop(0.5, p.color);
                grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd;
                ctx.fillRect(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2);
            } else {
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
        }
        ctx.globalAlpha = 1;

        // Floating texts
        for (let t of floatingTexts) {
            let alpha = t.life / t.maxLife;
            ctx.globalAlpha = alpha;
            ctx.fillStyle = t.color;
            ctx.font = `bold ${clamp(14 * scale, 12, 24)}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText(t.text, t.x, t.y);
        }
        ctx.globalAlpha = 1;

        // Damage flash overlay
        if (damageFlash > 0) {
            ctx.fillStyle = `rgba(255,0,0,${damageFlash / 16})`;
            ctx.fillRect(0, 0, W, H);
        }

        // Drag zone hint line
        if (gameRunning) {
            ctx.strokeStyle = 'rgba(255,255,255,0.04)';
            ctx.setLineDash([4, 10]);
            ctx.beginPath();
            ctx.moveTo(0, H * 0.55);
            ctx.lineTo(W, H * 0.55);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.restore();
    }

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function gameLoop() {
        if (!gameRunning) return;
        update();
        draw();
        animId = requestAnimationFrame(gameLoop);
    }

    function startGame() {
        document.getElementById('startScreen').style.display = 'none';
        document.getElementById('gameOverScreen').style.display = 'none';
        score = 0;
        lives = 3;
        stage = 1;
        bullets = [];
        enemyBullets = [];
        particles = [];
        powerUps = [];
        lasers = [];
        missiles = [];
        blackHoles = [];
        boomerangs = [];
        lightningBolts = [];
        gravityFlipped = false;
        minigunAngle = 0;
        floatingTexts = [];
        formationX = 0;
        frameCount = 0;
        currentPowerUp = null;
        powerUpTimer = 0;
        shieldHP = 0;
        comboCount = 0;
        comboTimer = 0;
        screenShake = 0;
        invincibleTimer = 0;
        damageFlash = 0;
        player.x = W / 2;
        player.y = H - 100 * scale;
        powerUpHud.style.opacity = '0';
        document.getElementById('scoreHud').textContent = 'SCORE: 0';
        document.getElementById('stageHud').textContent = 'STAGE 1';
        updateLivesHud();
        spawnWave();
        gameRunning = true;

        if (autoFireInterval) clearInterval(autoFireInterval);
        autoFireInterval = setInterval(() => {
            if (gameRunning) fire();
        }, FIRE_RATE);

        gameLoop();
    }

    function gameOver() {
        gameRunning = false;
        if (autoFireInterval) { clearInterval(autoFireInterval); autoFireInterval = null; }
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        if (score > hiScore) {
            hiScore = score;
            localStorage.setItem('galagaHi', hiScore);
        }
        document.getElementById('finalScore').textContent = 'SCORE: ' + score;
        document.getElementById('hiScoreText').textContent = 'HI-SCORE: ' + hiScore;
        document.getElementById('gameOverScreen').style.display = 'flex';
    }

    // ----- TOUCH CONTROLS -----
    let activeTouchId = null;
    let touchOffsetX = 0;

    touchZone.addEventListener('touchstart', function(e) {
        e.preventDefault();
        if (!gameRunning) return;
        const t = e.changedTouches[0];
        activeTouchId = t.identifier;
        touchOffsetX = player.x - t.clientX;
    }, { passive: false });

    touchZone.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!gameRunning) return;
        for (let i = 0; i < e.changedTouches.length; i++) {
            const t = e.changedTouches[i];
            if (t.identifier === activeTouchId) {
                let newX = t.clientX + touchOffsetX;
                newX = Math.max(player.w * 0.5, Math.min(W - player.w * 0.5, newX));
                player.x = newX;
            }
        }
    }, { passive: false });

    touchZone.addEventListener('touchend', function(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            if (e.changedTouches[i].identifier === activeTouchId) activeTouchId = null;
        }
    }, { passive: false });

    touchZone.addEventListener('touchcancel', function() { activeTouchId = null; }, { passive: false });

    canvas.addEventListener('touchstart', function(e) { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

    // Keyboard
    let keys = {};
    document.addEventListener('keydown', function(e) { keys[e.key] = true; });
    document.addEventListener('keyup', function(e) { keys[e.key] = false; });
    setInterval(function() {
        if (!gameRunning) return;
        if (keys['ArrowLeft'] || keys['a']) player.x = Math.max(player.w * 0.5, player.x - player.speed * scale);
        if (keys['ArrowRight'] || keys['d']) player.x = Math.min(W - player.w * 0.5, player.x + player.speed * scale);
        if (keys[' ']) fire();
    }, 16);

    document.getElementById('startBtn').addEventListener('click', startGame);
    document.getElementById('startBtn').addEventListener('touchend', function(e) { e.preventDefault(); startGame(); });
    document.getElementById('restartBtn').addEventListener('click', startGame);
    document.getElementById('restartBtn').addEventListener('touchend', function(e) { e.preventDefault(); startGame(); });

    document.addEventListener('touchmove', function(e) {
        if (e.target === document.body || e.target === document.documentElement) e.preventDefault();
    }, { passive: false });

    draw();

})();
</script>
</body>
